version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: sograi-local
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sograi-local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sograi-local}
      POSTGRES_DB: ${POSTGRES_DB:-sograi_local_db}
    ports:
      - "${POSTGRES_PORT:-9092}:5432"
    volumes:
      - sograi_local_pgdata::/var/lib/postgresql

volumes:
  sograi_pgdata:
    name: sograi_local_postgres_data
