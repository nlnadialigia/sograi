packages:
  - 'sograi-backend'
  - 'sograi-frontend'

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  protobufjs: true
  workerd: true

onlyBuiltDependencies:
  - '@google/genai'
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - 'esbuild'
  - 'prisma'
  - 'protobufjs'
  - 'workerd'

overrides:
  'multer': '2.5.0'
  'glob': '14.0.2'
  'minimatch': '11.0.1'

minimumReleaseAgeExclude:
  - vite@8.3.6
